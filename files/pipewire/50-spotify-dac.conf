# /etc/pipewire/pipewire.conf.d/50-spotify-dac.conf  (installed by spotify-dac)
# Spotify streams at 44.1 kHz. Run the graph at 44.1 kHz and let it follow the
# stream rate so PipeWire never resamples on the way to the DAC.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}

# /etc/wireplumber/wireplumber.conf.d/50-spotify-dac.conf  (installed by spotify-dac)
monitor.alsa.rules = [
  {
    # HDMI audio is never used on this box; hide it so the DAC is the only sink
    matches = [ { device.name = "~alsa_card.platform-.*hdmi.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    # never suspend the DAC when idle (avoids clicks and relock delay on play)
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]

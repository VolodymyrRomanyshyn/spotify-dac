# /etc/wireplumber/wireplumber.conf.d/51-spotify-dac-bluetooth.conf  (installed by spotify-dac)
# Bluetooth speaker: the box accepts A2DP audio from phones (sink role). Without this the phone
# finds no audio device to send music to, even when paired and connected.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
  bluez5.codecs = [ sbc sbc_xq aac ]
  bluez5.enable-sbc-xq = true
  bluez5.hfphsp-backend = "none"
}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Spotify DAC</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#15171c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><svg class="home-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="device">DAC</span></a>
    <div class="menu">
      <button id="burger" class="theme" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav id="menu" class="menu-list" hidden>
        <a href="/" class="active">Home</a>
        <a data-feature="radio" href="/radio.html">Radio</a>
        <a href="/status.html">Status</a>
        <a href="/settings.html">Settings</a>
      </nav>
    </div>
    <button id="theme" class="theme" type="button" aria-label="Switch dark or light mode">Theme</button>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>

    <div class="switch" role="group" aria-label="Source">
      <button type="button" id="src-spotify" class="src-icon" data-feature="spotify" aria-label="Spotify" title="Spotify"><span class="led" aria-hidden="true"></span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M7 9.5c3-1 7-.8 10 1M7.8 12.8c2.6-.8 5.8-.6 8.2.8M8.6 15.8c2-.6 4.4-.4 6.2.6"/></svg></button>
      <button type="button" id="src-radio" class="src-icon" data-feature="radio" aria-label="Internet radio" title="Internet radio"><span class="led" aria-hidden="true"></span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l10-4"/><circle cx="16" cy="14" r="2.5"/><path d="M6 12h4"/></svg></button>
      <button type="button" id="src-airplay" class="src-icon" data-feature="airplay" aria-label="AirPlay" title="AirPlay"><span class="led" aria-hidden="true"></span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H4.5A2.5 2.5 0 0 1 2 14.5v-9A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v9a2.5 2.5 0 0 1-2.5 2.5H19"/><path d="M12 15l5 6H7z" fill="currentColor"/></svg></button>
    </div>

    <section class="card now">
      <div class="cover" id="cover" aria-hidden="true"></div>
      <div class="meta">
        <h1 id="title">Loading...</h1>
        <p class="muted" id="subtitle"></p>
        <div class="controls" id="controls"></div>
      </div>
    </section>

    <section class="card" id="volume-card">
      <div class="times"><strong>Volume</strong><span id="volume-value">-</span></div>
      <input id="volume" type="range" min="0" max="100" step="1" value="0" aria-label="Volume">
    </section>

    <section class="card" id="progress-card">
      <div class="times"><span id="elapsed">-</span><span id="remaining">-</span></div>
      <input id="progress" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="Track position">
    </section>

    <section class="card" id="stations-card" hidden>
      <h2>Stations</h2>
      <div id="stations" class="stations"></div>
    </section>

    <p class="status-line" id="status-line"><a href="/status.html">Status</a></p>
  </main>

  <script src="common.js"></script>
  <script src="home.js"></script>
</body>
</html>

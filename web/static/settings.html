<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Spotify DAC - Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><svg class="home-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="device">DAC</span></a>
    <div class="menu">
      <button id="burger" class="theme" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav id="menu" class="menu-list" hidden>
        <a href="/">Home</a>
        <a href="/radio.html">Radio</a>
        <a href="/status.html">Status</a>
        <a href="/settings.html" class="active">Settings</a>
      </nav>
    </div>
    <button id="theme" class="theme" type="button" aria-label="Switch dark or light mode">Theme</button>
  </header>

  <main class="settings">
    <section class="card">
      <h2>General</h2>
      <form id="general-form" class="form">
        <label class="field">
          <span>Device name</span>
          <input id="DEVICE_NAME" type="text" maxlength="32" autocomplete="off">
          <small class="muted" data-hint="DEVICE_NAME"></small>
        </label>
        <label class="field">
          <span>Default volume</span>
          <input id="DEFAULT_VOLUME" type="number" min="0" max="100" step="1">
          <small class="muted" data-hint="DEFAULT_VOLUME"></small>
        </label>
      </form>
      <div class="actions">
        <button id="save-general" class="ctl main" type="button">Save general</button>
        <span id="general-status" class="muted" role="status"></span>
      </div>
    </section>

    <section class="card">
      <h2>GPIO</h2>
      <form id="gpio-form" class="form">
        <label class="field">
          <span>Case</span>
          <span class="select">
            <select id="case">
              <option value="nespi">RetroFlag NESPi Case+</option>
              <option value="none">No GPIO control</option>
            </select>
            <svg class="chevron" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5l5 5 5-5"/></svg>
          </span>
        </label>
        <div id="nespi-only" class="form">
          <label class="field">
            <span>Power switch GPIO</span>
            <input id="power_pin" type="number" min="0" max="27" step="1">
          </label>
          <label class="field">
            <span>Reset button GPIO</span>
            <input id="reset_pin" type="number" min="0" max="27" step="1">
          </label>
          <label class="field">
            <span>Case LED GPIO</span>
            <input id="led_pin" type="number" min="0" max="27" step="1">
          </label>
          <label class="field">
            <span>When the power switch is turned off</span>
            <span class="select">
              <select id="poweroff">
                <option value="hardcut">Hard cut (proven)</option>
                <option value="graceful">Graceful (experimental)</option>
              </select>
              <svg class="chevron" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5l5 5 5-5"/></svg>
            </span>
          </label>
          <p class="muted">Power enable GPIO: <span id="power_enable_pin"></span>. Set by the installer, not here.</p>
        </div>
        <div class="toggle">
          <input id="fan_enabled" type="checkbox">
          <label for="fan_enabled">Fan on a GPIO pin</label>
        </div>
        <label id="fan-pin-field" class="field" hidden>
          <span>Fan GPIO</span>
          <input id="fan_pin" type="number" min="0" max="27" step="1">
        </label>
        <p id="hat-note" class="muted"></p>
      </form>
      <div class="actions">
        <button id="save-gpio" class="ctl main" type="button">Save GPIO</button>
        <span id="gpio-status" class="muted" role="status"></span>
      </div>
    </section>

    <section class="card">
      <h2>Updates</h2>
      <form id="updates-form" class="form">
        <label class="field">
          <span>Update Soloist after (days)</span>
          <input id="SOLOIST_UPDATE_AFTER_DAYS" type="number" min="1" max="89" step="1">
          <small class="muted" data-hint="SOLOIST_UPDATE_AFTER_DAYS"></small>
        </label>
        <label class="field">
          <span>Update system packages after (days)</span>
          <input id="APT_UPGRADE_AFTER_DAYS" type="number" min="0" max="365" step="1">
          <small class="muted" data-hint="APT_UPGRADE_AFTER_DAYS"></small>
        </label>
      </form>
      <div class="actions">
        <button id="save-updates" class="ctl main" type="button">Save updates</button>
        <span id="updates-status" class="muted" role="status"></span>
      </div>

      <h3>Code from GitHub</h3>
      <p id="code-status" class="muted">Checking GitHub...</p>
      <ul id="code-commits" class="commits"></ul>
      <div class="actions">
        <button id="check" class="ctl" type="button">Check for updates</button>
        <button id="update" class="ctl main" type="button" disabled>Update from GitHub</button>
      </div>
      <p class="muted">Updates the web interface and radio files and restarts the web service. Audio and boot changes still need <code>sudo bash install.sh</code>.</p>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>

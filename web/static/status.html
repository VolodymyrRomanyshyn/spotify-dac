<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Spotify DAC - Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="device" id="device">DAC</span>
    <div class="menu">
      <button id="burger" class="theme" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav id="menu" class="menu-list" hidden>
        <a href="/">Home</a>
        <a href="/radio.html">Radio</a>
        <a href="/status.html" class="active">Status</a>
      </nav>
    </div>
    <button id="theme" class="theme" type="button" aria-label="Switch dark or light mode">Theme</button>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>

    <section class="overall" id="overall">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <h1 id="overall-text">Checking...</h1>
        <p id="overall-detail" class="muted"></p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </section>

    <div class="grid" id="cards"></div>
    <p class="muted small" id="updated"></p>
  </main>

  <script src="common.js"></script>
  <script src="status.js"></script>
</body>
</html>
